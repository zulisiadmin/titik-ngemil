<!doctype html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard Admin — Titik Ngemil</title><link rel="stylesheet" href="styles.css"></head><body class="dashboard-body"><header class="dashboard-header"><a class="brand" href="index.html"><span class="brand-mark">T</span><span><strong>Titik Ngemil</strong><small>Backoffice</small></span></a><div class="dashboard-header-actions"><a href="index.html">Lihat situs</a><button id="logout">Keluar</button></div></header><div class="dashboard-shell"><aside class="dashboard-sidebar"><button class="is-active" data-pane="overview">Ringkasan</button><button data-pane="tenants">Tenant</button><button data-pane="applications">Pendaftaran</button></aside><main class="dashboard-content"><div class="dashboard-notice" id="notice"></div><section class="dashboard-pane" id="pane-overview"><div class="dashboard-title"><div><p class="eyebrow">Backoffice</p><h1>Ringkasan.</h1></div></div><div class="dashboard-grid" id="admin-stats"></div></section><section class="dashboard-pane" id="pane-tenants" hidden><div class="dashboard-title"><div><p class="eyebrow">Data tenant</p><h1>Kelola tenant.</h1></div><button class="button button-primary" id="add-tenant">Tambah tenant</button></div><div class="data-table-wrap"><table class="data-table"><thead><tr><th>Tenant</th><th>Kontak</th><th>Booth</th><th>Status</th><th>Menu</th><th>Aksi</th></tr></thead><tbody id="tenant-rows"></tbody></table></div></section><section class="dashboard-pane" id="pane-applications" hidden><div class="dashboard-title"><div><p class="eyebrow">Kurasi</p><h1>Pendaftaran.</h1></div></div><div class="data-table-wrap"><table class="data-table"><thead><tr><th>Nomor</th><th>Usaha</th><th>Status</th><th>Booth</th><th>Aksi</th></tr></thead><tbody id="application-rows"></tbody></table></div></section></main></div><div class="modal-backdrop" id="tenant-modal" hidden><div class="modal-card"><div class="modal-head"><h2 id="tenant-modal-title">Tenant</h2><button type="button" data-close="tenant">×</button></div><form class="crud-form" id="tenant-form"><input type="hidden" name="id"><div class="field"><label>Nama usaha</label><input name="brand" required></div><div class="field"><label>Pemilik</label><input name="owner" required></div><div class="field"><label>Email</label><input name="email" type="email" required></div><div class="field" id="password-field"><label>Kata sandi awal</label><input name="password" type="password" minlength="8"></div><div class="field"><label>Kategori</label><input name="category"></div><div class="field"><label>WhatsApp</label><input name="phone"></div><div class="field"><label>Nomor booth</label><input name="booth" type="number" min="1" max="24"></div><div class="field"><label>Status booth</label><select name="booth_status"><option value="buka">Buka</option><option value="tutup">Tutup</option><option value="habis">Habis</option></select></div><div class="field full"><label>Cerita</label><textarea name="story"></textarea></div><button class="button button-primary" type="submit">Simpan tenant</button></form></div></div><div class="modal-backdrop" id="application-modal" hidden><div class="modal-card"><div class="modal-head"><h2>Perbarui pendaftaran</h2><button type="button" data-close="application">×</button></div><form class="crud-form" id="application-form"><input type="hidden" name="app_id"><div class="field"><label>Status</label><select name="stage"><option value="terkirim">Terkirim</option><option value="ditinjau">Ditinjau</option><option value="verifikasi">Verifikasi</option><option value="disetujui">Disetujui</option><option value="perlu-revisi">Perlu revisi</option><option value="ditolak">Ditolak</option></select></div><div class="field"><label>Booth</label><input name="booth" type="number" min="1" max="24"></div><div class="field full"><label>Catatan</label><textarea name="note"></textarea></div><button class="button button-primary" type="submit">Simpan status</button></form></div></div><div class="modal-backdrop" id="admin-menu-modal" hidden><div class="modal-card"><div class="modal-head"><h2 id="admin-menu-title">Menu tenant</h2><button type="button" data-close="menus">×</button></div><form class="crud-form" id="admin-menu-form"><input type="hidden" name="tenant_id"><input type="hidden" name="id"><div class="field"><label>Nama menu</label><input name="name" required></div><div class="field"><label>Harga</label><input name="price" type="number" min="0" required></div><div class="field full"><label>Deskripsi</label><input name="description"></div><div class="field"><label>Ketersediaan</label><select name="available"><option value="true">Tersedia</option><option value="false">Habis</option></select></div><button class="button button-primary" type="submit">Simpan menu</button></form><div class="data-table-wrap" style="margin-top:20px"><table class="data-table"><tbody id="admin-menu-rows"></tbody></table></div></div></div><script src="api.js"></script><script src="admin-dashboard.js"></script></body></html>
